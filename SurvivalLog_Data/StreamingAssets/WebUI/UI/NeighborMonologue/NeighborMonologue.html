    <style>
        :root {
            --bubble-bg-top:    rgba(28, 28, 32, 0.88);
            --bubble-bg-bottom: rgba(18, 18, 22, 0.92);
            --bubble-border-default: rgba(255, 193, 7, 0.35);
            --bubble-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 12px rgba(255, 193, 7, 0.06);
            --text-main: #eee;
            --text-dim: #999;
            --accent: #FFC107;
            --accent-glow: rgba(255, 193, 7, 0.28);
            --font-main: "Microsoft YaHei UI", "Microsoft YaHei", "微软雅黑", sans-serif;

            --tag-sick:    #FFAB91;
            --tag-despair: rgba(255, 255, 255, 0.18);
            --tag-calm:    rgba(255, 193, 7, 0.35);
            --tag-happy:   rgba(255, 193, 7, 0.65);
            --tag-distant: rgba(255, 193, 7, 0.45);
            --tag-close:   rgba(255, 193, 7, 0.55);
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: transparent;
            font-family: var(--font-main);
            overflow: hidden;
            color: var(--text-main);
        }

        .bubble {
            position: fixed;
            left: 0; top: 0;
            transform: translate(-50%, -100%);
            max-width: 320px;
            min-width: 120px;
            padding: 12px 16px;
            background: linear-gradient(168deg, var(--bubble-bg-top) 0%, var(--bubble-bg-bottom) 100%);
            border: 1px solid var(--bubble-border-default);
            border-radius: 12px;
            box-shadow: var(--bubble-shadow);
            font-size: 15px;
            line-height: 1.55;
            color: var(--text-main);
            opacity: 0;
            margin-top: -14px;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1),
                        transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
                        border-color 240ms ease,
                        box-shadow 240ms ease,
                        max-height 320ms cubic-bezier(0.22, 1, 0.36, 1);
            max-height: 96px;
        }
        .bubble.entering {
            opacity: 0;
            transform: translate(-50%, calc(-100% + 8px));
        }
        .bubble.visible {
            opacity: 1;
            transform: translate(-50%, -100%);
        }
        .bubble.leaving {
            opacity: 0;
            transform: translate(-50%, calc(-100% - 4px));
            transition: opacity 240ms ease-in, transform 240ms ease-in;
        }

        .bubble.expanded {
            max-height: 280px;
        }

        .bubble-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .bubble.expanded .bubble-text {
            -webkit-line-clamp: unset;
            overflow: visible;
        }

        .bubble::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -7px;
            width: 12px; height: 12px;
            background: linear-gradient(168deg, var(--bubble-bg-top) 0%, var(--bubble-bg-bottom) 100%);
            border-right: 1px solid var(--bubble-border-default);
            border-bottom: 1px solid var(--bubble-border-default);
            transform: translateX(-50%) rotate(45deg);
            transition: border-color 240ms ease;
        }

        .bubble.tag-sick { border-color: var(--tag-sick); }
        .bubble.tag-sick::before { border-right-color: var(--tag-sick); border-bottom-color: var(--tag-sick); }

        .bubble.tag-despair { border-color: var(--tag-despair); }
        .bubble.tag-despair::before { border-right-color: var(--tag-despair); border-bottom-color: var(--tag-despair); }
        .bubble.tag-despair .bubble-text { color: rgba(238, 238, 238, 0.75); }

        .bubble.tag-calm { border-color: var(--tag-calm); }
        .bubble.tag-calm::before { border-right-color: var(--tag-calm); border-bottom-color: var(--tag-calm); }

        .bubble.tag-happy {
            border-color: var(--tag-happy);
        }
        .bubble.tag-happy::before { border-right-color: var(--tag-happy); border-bottom-color: var(--tag-happy); }
        .bubble.tag-happy::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: 0 0 22px rgba(255, 193, 7, 0.18);
            opacity: 0;
            animation: bubble-happy-glow 2.6s ease-in-out infinite;
        }
        @keyframes bubble-happy-glow {
            0%, 100% { opacity: 0; }
            50%      { opacity: 1; }
        }
        html.quality-low .bubble.tag-happy::after { animation: none; opacity: 0.5; }

        .bubble.tag-distant {
            border-style: dashed;
            border-color: var(--tag-distant);
        }
        .bubble.tag-distant::before {
            border-right: 1px dashed var(--tag-distant);
            border-bottom: 1px dashed var(--tag-distant);
        }

        .bubble.tag-close {
            border-color: var(--tag-close);
            box-shadow: var(--bubble-shadow), inset 0 0 0 3px rgba(255, 193, 7, 0.08);
        }
        .bubble.tag-close::before { border-right-color: var(--tag-close); border-bottom-color: var(--tag-close); }

        .bubble-expand-cue {
            position: absolute;
            right: 8px;
            bottom: 4px;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            background: rgba(255, 193, 7, 0.12);
            border: 1px solid rgba(255, 193, 7, 0.4);
            border-radius: 50%;
            font-size: 12px;
            line-height: 1;
            font-weight: 700;
            pointer-events: none;
            opacity: 0.9;
            box-shadow: 0 0 9px rgba(255, 193, 7, 0.3);
            animation: bubble-cue-breathe 1.4s ease-in-out infinite;
        }
        html.quality-low .bubble-expand-cue { animation: none; opacity: 0.85; }
        @keyframes bubble-cue-breathe {
            0%, 100% {
                opacity: 0.65;
                transform: translateY(0) scale(1);
            }
            50% {
                opacity: 1;
                transform: translateY(3px) scale(1.18);
            }
        }
        .bubble.expanded .bubble-expand-cue {
            animation: none;
            opacity: 0.7;
            transform: rotate(180deg);
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.18);
            color: var(--text-dim);
            box-shadow: none;
        }
        .bubble:hover .bubble-expand-cue {
            opacity: 1;
        }
        .bubble.is-truncated {
            padding-bottom: 32px;
        }

        .bubble:hover {
            border-color: var(--accent);
        }

        .bubble-close {
            position: absolute;
            top: 6px; right: 8px;
            width: 20px; height: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            padding: 0;
            border-radius: 4px;
            transition: color 160ms ease, background 160ms ease;
        }
        .bubble-close:hover {
            color: var(--accent);
            background: rgba(255, 193, 7, 0.08);
        }
        .bubble.expanded .bubble-close {
            display: flex;
        }
        .bubble.expanded .bubble-text {
            padding-right: 22px;
        }

        @media (prefers-reduced-motion: reduce) {
            .bubble, .bubble::before {
                transition: opacity 120ms linear;
            }
            .bubble.tag-happy {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div v-for="b in renderList" :key="b.key"
             class="bubble unity-interactive"
             :class="['tag-' + (b.tag || 'calm'), b.phase, { expanded: b.expanded, 'is-truncated': b.isTruncated }]"
             :style="{ left: b.anchorX + '%', top: b.anchorY + '%' }"
             @click.stop="onBubbleClick(b)">
            <button class="bubble-close unity-interactive"
                    @click.stop="onCloseClick(b)"
                    aria-label="关闭">✕</button>
            <div class="bubble-text" :ref="el => onBubbleTextMount(b, el)">{{ b.text }}</div>
            <span class="bubble-expand-cue" v-if="b.isTruncated">▼</span>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted, onBeforeUnmount } = Vue;

        createApp({
            setup() {
                const core = createWebUICore('NeighborMonologue');

                const bubbles = reactive([]);
                const pendingQueue = [];
                let nextKey = 1;
                let autoHideTimer = null;

                const renderList = computed(() => bubbles);

                const looksTruncated = (text) => {
                    if (!text) return false;
                    let w = 0;
                    for (const ch of text) {
                        w += ch.charCodeAt(0) > 127 ? 18 : 9;
                    }
                    return w > 280;
                };

                const showMonologue = (data) => {
                    if (!data || !data.text) return;

                    const hasExpanded = bubbles.some(b =>
                        b.expanded && (b.phase === 'visible' || b.phase === 'entering')
                    );
                    if (hasExpanded) {
                        pendingQueue.push(data);
                        return;
                    }

                    bubbles.forEach(b => {
                        if (b.phase === 'visible' || b.phase === 'entering') {
                            b.phase = 'leaving';
                        }
                    });
                    setTimeout(() => {
                        for (let i = bubbles.length - 1; i >= 0; i--) {
                            if (bubbles[i].phase === 'leaving') bubbles.splice(i, 1);
                        }
                    }, 280);

                    const newBubble = reactive({
                        key: nextKey++,
                        text: data.text,
                        tag: data.tag || 'calm',
                        anchorX: typeof data.anchorX === 'number' ? data.anchorX * 100 : 50,
                        anchorY: typeof data.anchorY === 'number' ? data.anchorY * 100 : 50,
                        autoHideSeconds: data.autoHideSeconds || 6,
                        monologueId: data.monologueId || ('m_' + nextKey),
                        expanded: false,
                        isTruncated: looksTruncated(data.text),
                        phase: 'entering'
                    });
                    bubbles.push(newBubble);

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => { newBubble.phase = 'visible'; });
                    });

                    scheduleAutoHide(newBubble);
                };

                const scheduleAutoHide = (bubble) => {
                    clearTimeout(autoHideTimer);
                    if (bubble.expanded) return;
                    autoHideTimer = setTimeout(() => {
                        hideBubble(bubble);
                    }, bubble.autoHideSeconds * 1000);
                };

                const hideBubble = (bubble) => {
                    if (!bubble) return;
                    bubble.phase = 'leaving';
                    setTimeout(() => {
                        const idx = bubbles.findIndex(b => b.key === bubble.key);
                        if (idx >= 0) bubbles.splice(idx, 1);
                        playNextPending();
                    }, 280);
                    core.UnitySendEvent('MONOLOGUE_DISMISSED', { monologueId: bubble.monologueId });
                };

                const playNextPending = () => {
                    if (pendingQueue.length === 0) return;
                    const next = pendingQueue.shift();
                    showMonologue(next);
                };

                const onBubbleClick = (bubble) => {
                    bubble.expanded = !bubble.expanded;
                    if (bubble.expanded) {
                        clearTimeout(autoHideTimer);
                    } else {
                        scheduleAutoHide(bubble);
                    }
                    core.clickThrough.syncNowAfterReflow();
                };

                const onCloseClick = (bubble) => {
                    hideBubble(bubble);
                };

                const onBubbleTextMount = (bubble, el) => {
                    if (!el) return;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            if (bubble && el.scrollWidth !== undefined) {
                                bubble.isTruncated = el.scrollWidth > el.clientWidth + 1;
                            }
                        });
                    });
                };

                core.registerHandlers({
                    'WebUI_NeighborMonologue_ShowMsg': (data) => showMonologue(data),
                    'WebUI_NeighborMonologue_DismissMsg': (data) => {
                        const target = bubbles.find(b => b.monologueId === data.monologueId);
                        if (target) hideBubble(target);
                    }
                });

                onMounted(() => {
                    core.clickThrough.start();
                    core.notifyReady();
                });

                onBeforeUnmount(() => {
                    clearTimeout(autoHideTimer);
                    core.clickThrough.stop();
                });

                return {
                    renderList, onBubbleClick, onCloseClick, onBubbleTextMount
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
