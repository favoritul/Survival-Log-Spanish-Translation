                // 且面板重开 = 新 iframe + 新 PAGE_READY 也会补发，条目从不失效。一次性事件（收一次就该消费掉的提示）

                    'SpeedUp', 'TrapFloatPopup', 'GeneratorFloatPopup', 'FuelGeneratorFloatPopup'

                    passThrough === undefined ? PASSTHROUGH_FALLBACK_IDS.has(pageId) : !!passThrough;

                            visible: true,
                            passThrough: resolvePassThrough(pageId, passThrough)

                            // → 强制换 src 并重开一轮 watchdog 预算。不比 prevUrl：Editor 的 cache-buster
                            // 是时间戳、每次 LOAD_PAGE 的 url 都不同，比 url 会漏掉 arm、退化成无兜底的裸 reload。

                            if (frame) frame.style.display = 'none';

                            if (frame) frame.style.display = 'block';
                        });

                    disarmReadyWatchdog(pageId);
                    readyPages.delete(pageId);

                        nextTick(() => {

                            if (frame) frame.remove();
                        });

                    } else {

                    }

                                    }

                                            clientX: data.clientX,
                                            clientY: data.clientY
                                        }, '*');

                }, { deep: true });

                return { state };
            }
        });

        app.mount('#app');
        console.log('[Vue] Root Orchestrator initialized with Vue 3');
    </script>
</body>
